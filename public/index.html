<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treasure Chess</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><p class="eyebrow">CAPTAIN'S TABLE</p><h1>Treasure Chess</h1><p>Classic chess, buried treasure style.</p></div><button id="sound" class="ghost">Sound: On</button></header><section class="modes"><button data-mode="hotseat" class="active">Hot-Seat</button><button data-mode="computer">VS Computer</button><button data-mode="online">Online</button></section><section id="onlinePanel" class="online hidden"><input id="room" maxlength="12" placeholder="ROOM CODE"><button id="join">Join Room</button><span id="role"></span></section><section class="game"><div><div id="status" class="status"></div><div id="board" class="board" aria-label="Chess board"></div></div><aside><h2>Captain's Log</h2><p id="help">Select a piece, then choose a highlighted legal square.</p><div class="legend"><b>Gold</b> sails as White.<br><b>Brown</b> sails as Black.</div><button id="newGame">New Game</button><button id="resign" class="danger hidden">Resign</button></aside></section></main><dialog id="promotion"><form method="dialog"><h2>Choose your treasure</h2><div id="promotionChoices"></div></form></dialog><script type="module" src="/app.js"></script></body></html>
